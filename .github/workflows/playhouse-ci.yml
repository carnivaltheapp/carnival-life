name: PlayHouse CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Start isolated Supabase
        run: npm run db:start

      - name: Reset isolated Supabase schema
        run: npm run db:reset

      - name: Playwright regression suite
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-failure-artifacts
          path: |
            apps/playhouse/playwright-report/
            apps/playhouse/test-results/
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        run: npm run db:stop -- --no-backup
