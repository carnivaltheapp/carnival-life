name: PlayHouse CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop-native-host:
    name: Desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Windows host
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force desktop/workspace/dist | Out-Null
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /target:exe "/out:desktop\workspace\dist\CarnivalWorkspaceHost.exe" desktop/workspace/windows/CarnivalWorkspaceHost.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile macOS host
        if: runner.os == 'macOS'
        run: |
          mkdir -p desktop/workspace/dist
          swiftc -framework AppKit desktop/workspace/macos/CarnivalWorkspaceHost.swift -o desktop/workspace/dist/CarnivalWorkspaceHost

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Desktop workspace tests
        run: npm run test:desktop

      - name: Start isolated Supabase
        run: npm run db:start

      - name: Reset isolated Supabase schema
        run: npm run db:reset

      - name: Playwright regression suite
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: playwright-failure-artifacts
          path: |
            apps/playhouse/playwright-report/
            apps/playhouse/test-results/
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        run: npm run db:stop -- --no-backup
